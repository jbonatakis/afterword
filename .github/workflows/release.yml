name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions: {}

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: afterword-main-draft
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Update draft for the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/draft-release.py

  build:
    if: github.event_name == 'release'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: afterword-build-${{ github.event.release.id }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the release tag and runner
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$GITHUB_SHA" ]]
          [[ "$(uname -m)" == arm64 ]]
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.29
      - name: Fetch the private Lookback dependency
        env:
          GH_TOKEN: ${{ secrets.LOOKBACK_READ_TOKEN }}
        run: |
          : "${GH_TOKEN:?Set LOOKBACK_READ_TOKEN to a token with read access to Lookback}"
          url=https://github.com/jbonatakis/lookback.git
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' clone --bare "$url" "$RUNNER_TEMP/lookback.git"
          git config --global url."file://$RUNNER_TEMP/lookback.git".insteadOf "$url"
      - name: Build and verify the Apple Silicon release
        env:
          AFTERWORD_GITHUB_CLIENT_ID: ${{ vars.AFTERWORD_GITHUB_CLIENT_ID }}
        run: ./Scripts/build-release.sh "$RELEASE_TAG"
      - name: Attach the Apple Silicon ZIP to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "build/release/Afterword-$RELEASE_TAG-macOS-arm64.zip" --clobber
