name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: afterword-main-draft
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Update draft for the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/draft-release.py

  build:
    if: github.event_name == 'release'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: afterword-build-${{ github.event.release.id }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the release tag and runner
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$GITHUB_SHA" ]]
          [[ "$(uname -m)" == arm64 ]]
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.29
      - name: Build and verify the Apple Silicon release
        env:
          AFTERWORD_GITHUB_CLIENT_ID: ${{ vars.AFTERWORD_GITHUB_CLIENT_ID }}
        run: ./Scripts/build-release.sh "$RELEASE_TAG"
      - name: Attach the Apple Silicon ZIP to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "build/release/Afterword-$RELEASE_TAG-macOS-arm64.zip" --clobber

  distribute-cask:
    needs: build
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' ||
          (needs.build.result == 'success' && !github.event.release.prerelease)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the public tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: jbonatakis/homebrew-tap
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Stage the verified app ZIP for the tap publisher
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          release=latest
          if [[ -n "$RELEASE_TAG" ]]; then release="tags/$RELEASE_TAG"; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$release" > "$RUNNER_TEMP/release.json"
          tag=$(jq -er 'select(.draft == false and .prerelease == false) | .tag_name' "$RUNNER_TEMP/release.json")
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          asset="Afterword-$tag-macOS-arm64.zip"
          digest=$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset and .state == "uploaded") | .digest' "$RUNNER_TEMP/release.json")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && echo "${digest#sha256:}  $asset" | sha256sum --check --strict)
          mkdir afterword-upload
          echo "${digest#sha256:}" > afterword-upload/sha256
          # Transport only the ZIP, in chunks below GitHub's Git object size limit.
          split -b 48M -d -a 4 "$RUNNER_TEMP/$asset" afterword-upload/part-
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Send the ZIP to the public tap
        env:
          RELEASE_TAG: ${{ steps.stage.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- afterword-upload
          git commit -m "Stage Afterword $RELEASE_TAG for public distribution"
          git push origin "HEAD:refs/heads/publish/afterword-$RELEASE_TAG/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
