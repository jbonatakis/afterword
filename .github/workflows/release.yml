name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: afterword-main-draft
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Update draft for the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/draft-release.py

  build:
    if: github.event_name == 'release'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: afterword-build-${{ github.event.release.id }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the release tag and runner
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$GITHUB_SHA" ]]
          [[ "$(uname -m)" == arm64 ]]
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.29
      - name: Fetch the private Lookback dependency
        env:
          GH_TOKEN: ${{ secrets.LOOKBACK_READ_TOKEN }}
        run: |
          : "${GH_TOKEN:?Set LOOKBACK_READ_TOKEN to a token with read access to Lookback}"
          url=https://github.com/jbonatakis/lookback.git
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' clone --bare "$url" "$RUNNER_TEMP/lookback.git"
          git config --global url."file://$RUNNER_TEMP/lookback.git".insteadOf "$url"
      - name: Build and verify the Apple Silicon release
        env:
          AFTERWORD_GITHUB_CLIENT_ID: ${{ vars.AFTERWORD_GITHUB_CLIENT_ID }}
        run: ./Scripts/build-release.sh "$RELEASE_TAG"
      - name: Attach the Apple Silicon ZIP to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "build/release/Afterword-$RELEASE_TAG-macOS-arm64.zip" --clobber

  update-cask:
    needs: build
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' ||
          (needs.build.result == 'success' && !github.event.release.prerelease)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read the published release and asset checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          release=latest
          if [[ -n "$RELEASE_TAG" ]]; then release="tags/$RELEASE_TAG"; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$release" > "$RUNNER_TEMP/release.json"
      - name: Check out the Homebrew tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: jbonatakis/homebrew-tap
          ref: main
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Publish the cask to the tap
        run: |
          git -C tap config user.name 'github-actions[bot]'
          git -C tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Start from the current tap head if another publisher pushed first.
            git -C tap fetch origin main
            git -C tap reset --hard FETCH_HEAD
            python3 Scripts/update-homebrew-cask.py "$RUNNER_TEMP/release.json" tap/Casks/afterword.rb
            if ! git -C tap diff --quiet -- Casks/afterword.rb; then
              git -C tap add Casks/afterword.rb
              git -C tap commit -m "Update Afterword cask to $(jq -r .tag_name "$RUNNER_TEMP/release.json")"
            fi
            if git -C tap push origin HEAD:main; then exit 0; fi
          done
          exit 1
