name: PR tests

on: pull_request

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: macOS tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run migration tests
        run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Run Swift test suite
        run: ./Scripts/test.sh
      - name: Run offscreen library UI tests
        run: ./Scripts/check-library.sh
