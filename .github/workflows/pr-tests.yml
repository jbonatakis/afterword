name: PR tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        type: choice
        required: true
        default: all
        options: [all, swift, library-ui]

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift tests
    if: github.event_name == 'pull_request' || inputs.suite == 'all' || inputs.suite == 'swift'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run Swift test suite
        run: ./Scripts/test.sh

  library-ui:
    name: Library UI tests
    if: github.event_name == 'pull_request' || inputs.suite == 'all' || inputs.suite == 'library-ui'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run offscreen library UI tests
        run: ./Scripts/check-library.sh
      - name: Upload calendar scroll screenshots
        if: ${{ !cancelled() && hashFiles('build/calendar-scroll/*.png') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: calendar-scroll
          path: build/calendar-scroll/*.png
